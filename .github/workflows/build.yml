name: Construire les applications

on:
  workflow_dispatch:

# Publication manuelle après vérification, sous l'identité du mainteneur.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            target: win
            arch: x64
            artifact: Windows
          - name: Mac Apple Silicon
            os: macos-15
            target: mac
            arch: arm64
            artifact: macOS-arm64
          - name: Mac Intel
            os: macos-15-intel
            target: mac
            arch: x64
            artifact: macOS-x64
          - name: Linux
            os: ubuntu-22.04
            target: linux
            arch: x64
            artifact: Linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXPECTED_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le code, la version et FFmpeg
        run: npm run check

      - name: Construire pour cette machine
        run: npx --no-install electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Tester l'application empaquetée
        if: runner.os != 'Linux'
        run: npm run smoke:packaged

      - name: Tester l'application Linux avec un écran virtuel
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged

      - name: Préparer les fichiers et leurs empreintes
        run: npm run release:prepare

      - name: Conserver les téléchargements vérifiés
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PXSize-${{ matrix.artifact }}
          path: release/staged/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Conserver les résultats des tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Test-${{ matrix.artifact }}
          path: |
            output/smoke/*.png
            output/smoke/report.json
          if-no-files-found: ignore
          retention-days: 14
